volumes:
  media-data:
    driver: local
  postgres-data:
    driver: local
  model-cache:
    driver: local

services:
  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booru}
      POSTGRES_DB: ${POSTGRES_DB:-booru}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booru} -d ${POSTGRES_DB:-booru}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: booru:cpu
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: cpu
    environment:
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-booru}:${POSTGRES_PASSWORD:-booru}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-booru}?sslmode=disable
      - MEDIA_ROOT=/data/media
      - MEDIA_CONCURRENCY=${MEDIA_CONCURRENCY:-2}
      - ONNX_INTRA_THREADS=${ONNX_INTRA_THREADS:-}
      - DEV_MODE=${DEV_MODE:-false}
      - MODEL_CACHE_DIR=/cache/models
      - MODEL_NAME=${MODEL_NAME:-Siglip2_FP16}
      - MODEL_REPOSITORY=${MODEL_REPOSITORY:-onnx-community/siglip2-base-patch16-224-ONNX}
      - MODEL_REVISION=${MODEL_REVISION:-main}
      - MODEL_FILES=${MODEL_FILES:-}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - media-data:/data/media
      - model-cache:/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8080:8080"
